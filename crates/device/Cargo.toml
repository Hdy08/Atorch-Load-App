[package]
name = "atorch-device"
version.workspace = true
edition.workspace = true
[dependencies]
atorch-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
[target.'cfg(not(target_os = "android"))'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-native", "macos-shared-device"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
