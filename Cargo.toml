[workspace]
members = ["crates/protocol", "crates/device", "crates/tauri-plugin-atorch-usb", "crates/tauri-plugin-atorch-ble", "apps/app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
