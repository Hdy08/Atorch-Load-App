[package]
name = "atorch-app"
version.workspace = true
edition.workspace = true

[lib]
name = "atorch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
serde_json.workspace = true
json-patch = "4"

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
atorch-protocol = { path = "../../../crates/protocol" }
atorch-device = { path = "../../../crates/device" }
tauri-plugin-atorch-usb = { path = "../../../crates/tauri-plugin-atorch-usb" }
tauri-plugin-atorch-ble = { path = "../../../crates/tauri-plugin-atorch-ble" }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "UI_ViewManagement"] }
webview2-com = "0.39.1"
